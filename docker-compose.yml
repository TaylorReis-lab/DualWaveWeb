# Infraestrutura local do DualWave. Não constrói nem reinicia o site Next.js.
# Primeiro: copie .env.docker.example para .env.docker e defina as senhas.
# Depois: docker compose --env-file .env.docker up -d
name: dualwave

services:
  postgres:
    image: postgres:17-alpine
    container_name: dualwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    networks:
      - local

  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: dualwave-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Defina PGADMIN_DEFAULT_EMAIL no arquivo .env.docker}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no arquivo .env.docker}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - local

volumes:
  postgres_data:
    name: dualwave_postgres_data
  pgadmin_data:
    name: dualwave_pgadmin_data

networks:
  local:
    name: dualwave_local
    driver: bridge
